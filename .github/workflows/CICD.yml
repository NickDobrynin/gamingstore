name: Gaming Store Deployment
on:
  push:
    branches:
      - dev
  release:
    types: [published]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      
      - name: Prepare wordpress zip
        run: |
          WP_LINK=$(cat wp-version-control.cfg)
          wget -O ./wordpress.zip $WP_LINK

      - name: Prepare plugins and theme zip
        run: |
          zip -r wpcontent.zip plugins themes mu-plugins

      - name: Copy Zips to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./wordpress.zip, ./wpcontent.zip"
          target: ${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}

      - name: Enable Maintenance Mode
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: ".maintenance"
          target: ${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}

      - name: Update WordPress Core
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            TARGET="${{ github.event_name == 'push' && '/home/nikolay/public_html/dev' || '/home/nikolay/public_html/live' }}"
            unzip -t "$TARGET/wordpress.zip"
            unzip -o "$TARGET/wordpress.zip" -d "$TARGET/"
            test -f "$TARGET/wordpress/wp-load.php"
            cp -a "$TARGET/wordpress/." "$TARGET/"
            rm -rf "$TARGET/wordpress"
      
      - name: Update Plugins and Theme
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            rm -rf "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wp-content/plugins" "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wp-content/themes" "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wp-content/mu-plugins"
            unzip -o "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wpcontent.zip" -d "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wp-content/"

      - name: Disable Maintenance Mode and Remove Zips
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            rm -f "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/.maintenance"
            rm -f "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wordpress.zip"
            rm -f "${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}/wpcontent.zip"