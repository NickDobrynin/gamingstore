name: Gaming Store Deployment

on:
  push:
    branches:
      - dev
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_SSH_PASSWORD }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}

      TARGET_DIR: ${{ github.event_name == 'push' && 'public_html/dev' || 'public_html/live' }}

      WP_VERSION_FILE: wp-version-control.cfg
      WP_ARCHIVE: wordpress.zip
      CONTENT_ARCHIVE: wpcontent.zip
      MAINTENANCE_FILE: .maintenance

      WP_EXTRACT_DIR: wordpress
      WP_CONTENT_DIR: wp-content
      PLUGINS_DIR: plugins
      THEMES_DIR: themes
      MU_PLUGINS_DIR: mu-plugins

    steps:
      - name: Checkout code
        uses: actions/checkout@master

      - name: Prepare wordpress zip
        run: |
          WP_LINK=$(cat ${{ env.WP_VERSION_FILE }})
          wget -O ./${{ env.WP_ARCHIVE }} $WP_LINK

      - name: Prepare plugins and theme zip
        run: |
          zip -r ${{ env.CONTENT_ARCHIVE }} ${{ env.PLUGINS_DIR }} ${{ env.THEMES_DIR }} ${{ env.MU_PLUGINS_DIR }}

      - name: Copy Zips to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          source: "./${{ env.WP_ARCHIVE }}, ./${{ env.CONTENT_ARCHIVE }}"
          target: ${{ env.TARGET_DIR }}

      - name: Enable Maintenance Mode
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          source: ${{ env.MAINTENANCE_FILE }}
          target: ${{ env.TARGET_DIR }}

      - name: Update WordPress Core
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          script: |
            set -eu
            TARGET="${{ env.TARGET_DIR }}"
            WP_ARCHIVE="${{ env.WP_ARCHIVE }}"
            WP_EXTRACT_DIR="${{ env.WP_EXTRACT_DIR }}"

            unzip -t "$TARGET/$WP_ARCHIVE"
            unzip -o "$TARGET/$WP_ARCHIVE" -d "$TARGET/"
            test -f "$TARGET/$WP_EXTRACT_DIR/wp-load.php"
            cp -a "$TARGET/$WP_EXTRACT_DIR/." "$TARGET/"
            rm -rf "$TARGET/$WP_EXTRACT_DIR"

      - name: Update Plugins and Theme
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          script: |
            rm -rf "${{ env.TARGET_DIR }}/${{ env.WP_CONTENT_DIR }}/${{ env.PLUGINS_DIR }}" "${{ env.TARGET_DIR }}/${{ env.WP_CONTENT_DIR }}/${{ env.THEMES_DIR }}" "${{ env.TARGET_DIR }}/${{ env.WP_CONTENT_DIR }}/${{ env.MU_PLUGINS_DIR }}"
            unzip -o "${{ env.TARGET_DIR }}/${{ env.CONTENT_ARCHIVE }}" -d "${{ env.TARGET_DIR }}/${{ env.WP_CONTENT_DIR }}/"

      - name: Disable Maintenance Mode and Remove Zips
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          script: |
            rm -f "${{ env.TARGET_DIR }}/${{ env.MAINTENANCE_FILE }}"
            rm -f "${{ env.TARGET_DIR }}/${{ env.WP_ARCHIVE }}"
            rm -f "${{ env.TARGET_DIR }}/${{ env.CONTENT_ARCHIVE }}"